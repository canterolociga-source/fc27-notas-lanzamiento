<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110d">
<meta name="description" content="Centro de consulta personal de EA SPORTS FC™ 27 — Actualización de Lanzamiento.">
<title>EA SPORTS FC™ 27 · Centro de consulta</title>
<link rel="stylesheet" href="styles.css?v=20260915-7">
</head>
<body>
<div id="progress" class="progress"></div>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#inicio"><span class="brand-mark">FC<span>27</span></span><span><strong>Centro de consulta</strong><small>Actualización de Lanzamiento</small></span></a>
    <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menú">☰</button>
    <nav id="mainNav" class="main-nav" aria-label="Navegación principal"></nav>
    <button class="search-trigger" id="searchTrigger" aria-label="Abrir buscador">⌕ <span>Buscar</span><kbd>Ctrl K</kbd></button>
  </div>
</header>
<div id="searchPanel" class="search-panel" aria-hidden="true">
  <div class="search-box">
    <div class="search-row"><span class="search-icon">⌕</span><input id="globalSearch" type="search" placeholder="Buscar en todo el documento…" autocomplete="off"><button id="closeSearch" class="icon-btn" aria-label="Cerrar">×</button></div>
    <div id="searchMeta" class="search-meta">Busca títulos, secciones, párrafos, listas y fechas.</div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>
<main id="app"></main>
<button id="toTop" class="to-top" aria-label="Volver arriba">↑</button>
<script src="data.js?v=20260915-7"></script>
<script src="router-support.js?v=20260915-1"></script>
<script src="app.js?v=20260915-7"></script>
<script>
(()=>{
  const removeAllPages=()=>document.querySelectorAll('#app a,#app h1,#app h2,#app h3,#app h4,#app strong,#app span').forEach(el=>{
    const text=el.textContent.trim();
    if(text==='Todas las páginas'||text==='Índice completo'){
      const card=el.closest('.toc-card,.topic-card,.section-tile,.section,.view-head');
      if(card) card.remove();
    }
  });
  new MutationObserver(removeAllPages).observe(document.getElementById('app'),{childList:true,subtree:true});
  removeAllPages();
})();
</script>
</body>
</html>
